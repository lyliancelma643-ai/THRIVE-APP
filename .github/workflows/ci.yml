# CI THRIVE — garde-fou avant le déploiement Vercel (auto sur main).
# Périmètre : ce qui part en prod (packages/shared + apps/web).
# L'app mobile Expo est vérifiée par son typecheck (le build natif passe par EAS).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck · Lint · Build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup lit la version épinglée dans "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build @thrive/shared
        run: pnpm --filter @thrive/shared build

      - name: Typecheck web
        run: pnpm --filter web typecheck

      # App mobile Expo (soumise aux stores) : racine des routes = src/app.
      - name: Typecheck mobile
        run: pnpm --filter mobile typecheck

      - name: Lint web
        run: pnpm --filter web lint

      # Couche de transformation du Mode Terrain : les 39 fiches de séance
      # doivent produire des pages valides et des clés identiques au mode
      # standard, sinon des saisies coach seraient perdues.
      - name: Tests unitaires web
        run: pnpm --filter web test

      - name: Build web (production)
        run: pnpm --filter web build

  e2e:
    name: Playwright (parcours vitaux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build @thrive/shared
        run: pnpm --filter @thrive/shared build
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run E2E (build + start géré par Playwright)
        run: pnpm --filter web test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  e2e-client:
    name: Playwright (parcours client connectés, backend simulé)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build @thrive/shared
        run: pnpm --filter @thrive/shared build
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      # Inscription (enfants enregistrés), compte (export, suppression),
      # questionnaire enfant (brouillon, hors ligne), bilan hors ligne.
      # Aucun compte réel : scripts/ux-audit/mock simule Supabase.
      - name: Run E2E client (build mock + start gérés par Playwright)
        run: pnpm --filter web test:e2e:client
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-client
          path: apps/web/playwright-report/
          retention-days: 7

  edge-tests:
    name: Deno (edge functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Tous les *.test.ts des fonctions (facturation, signature Stripe,
      # nettoyage de compte, et tout test ajouté plus tard) sont exécutés
      # automatiquement : un test oublié ne peut plus passer inaperçu.
      # --no-config : sinon Deno 2.9 lit les tsconfig du monorepo (apps/mobile,
      # jsx « react-native ») et refuse de démarrer. Les tests n'ont besoin que de jsr:/esm.sh.
      - name: Tests Deno des edge functions
        run: find supabase/functions -name '*.test.ts' -print0 | xargs -0 deno test --no-config
      # Types des points d'entrée : une régression de type dans une fonction
      # déployée doit casser la CI, pas la production.
      - name: Vérification des types des edge functions
        run: deno check --no-config supabase/functions/*/index.ts

  rls-security:
    name: Sécurité RLS (Postgres jetable)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Réplique du schéma d'autorisation de prod + données synthétiques :
    # les tests doivent ÉCHOUER sans la migration 066 et PASSER avec.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Tests de sécurité RLS (avant / après migration 066)
        run: ./supabase/tests/local/run.sh

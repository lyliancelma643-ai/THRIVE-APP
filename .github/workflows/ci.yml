# CI THRIVE — garde-fou avant le déploiement Vercel (auto sur main).
# Périmètre : ce qui part en prod (packages/shared + apps/web).
# L'app mobile Expo (non déployée) est volontairement hors CI tant que sa
# résolution de types n'est pas stabilisée — la réintégrer le moment venu.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck · Lint · Build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup lit la version épinglée dans "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build @thrive/shared
        run: pnpm --filter @thrive/shared build

      - name: Typecheck web
        run: pnpm --filter web typecheck

      - name: Lint web
        run: pnpm --filter web lint

      # Couche de transformation du Mode Terrain : les 39 fiches de séance
      # doivent produire des pages valides et des clés identiques au mode
      # standard, sinon des saisies coach seraient perdues.
      - name: Tests unitaires web
        run: pnpm --filter web test

      - name: Build web (production)
        run: pnpm --filter web build

  e2e:
    name: Playwright (parcours vitaux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build @thrive/shared
        run: pnpm --filter @thrive/shared build
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run E2E (build + start géré par Playwright)
        run: pnpm --filter web test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  e2e-client:
    name: Playwright (parcours client connectés, backend simulé)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build @thrive/shared
        run: pnpm --filter @thrive/shared build
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      # Inscription (enfants enregistrés), compte (export, suppression),
      # questionnaire enfant (brouillon, hors ligne), bilan hors ligne.
      # Aucun compte réel : scripts/ux-audit/mock simule Supabase.
      - name: Run E2E client (build mock + start gérés par Playwright)
        run: pnpm --filter web test:e2e:client
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-client
          path: apps/web/playwright-report/
          retention-days: 7

  edge-tests:
    name: Deno (webhook Stripe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test cœur de la facturation (billing_core)
        run: deno test --no-config supabase/functions/_shared/billing_core.test.ts
      # --no-config : sinon Deno 2.9 lit les tsconfig du monorepo (apps/mobile,
      # jsx « react-native ») et refuse de démarrer. Le test n'a besoin que de jsr:.
      - name: Test signature Stripe
        run: deno test --no-config supabase/functions/stripe-webhook/verify.test.ts
      - name: Test nettoyage facturation (suppression de compte)
        run: deno test --no-config supabase/functions/admin-delete-user/billing_cleanup.test.ts
      - name: Test « 1 mois offert » du certificat (reward_core)
        run: deno test --no-config supabase/functions/_shared/reward_core.test.ts
      - name: Vérification des types des fonctions modifiées
        run: >-
          deno check --no-config
          supabase/functions/claim-certificate-reward/index.ts
          supabase/functions/create-checkout-session/index.ts
          supabase/functions/stripe-webhook/index.ts
          supabase/functions/admin-delete-user/index.ts
          supabase/functions/request-account-deletion/index.ts

  rls:
    name: RLS (miroir Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # Migrations 066 (co-parent), 067 (suppressions), 068 (mois offert) sur le
      # miroir de prod : chaque test doit passer avec sa migration, échouer sans.
      - name: Tests RLS avec migrations
        run: supabase/tests/rls/run-local.sh
      - name: Les tests détectent le défaut (sans migrations)
        run: supabase/tests/rls/run-local.sh --before
